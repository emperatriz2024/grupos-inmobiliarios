[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/selections"
  to = "/.netlify/functions/selections"
  status = 200

[[redirects]]
  from = "/api/selections/*"
  to = "/.netlify/functions/selections/:splat"
  status = 200

[[redirects]]
  from = "/s/:slug"
  to = "/selection.html?id=:slug"
  status = 200
